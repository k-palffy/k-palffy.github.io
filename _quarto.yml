project:
  type: website
  resources:
    - language-switch.js
    - robots.txt
    - files/Karoly_Palffy_CV.pdf
  render:
    - "*.qmd"
    - "posts/"
    - "!hu/"

website:
  title: "Károly Pálffy's website"
  site-url: "https://k-palffy.github.io"
  open-graph:
    locale: en_US
    site-name: "Károly Pálffy"
    image: "https://k-palffy.github.io/images/lake-balaton-dusk.jpg"
  twitter-card: true

  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: posts.qmd
        text: Posts
    
    right:
      - text: "Magyar"
        href: "/hu/"
        
format:
  html:
    canonical-url: true
    theme:
      light: [cosmo, custom.scss]
      dark: darkly
    css: styles.css
    link-external-newwindow: true
    include-after-body:
      text: |
        <script src="/language-switch.js?v=3"></script>
